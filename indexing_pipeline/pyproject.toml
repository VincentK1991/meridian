[project]
name = "indexing-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VincentK1991", email = "vkieuvongngam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "markitdown[all]>=0.1.2",
    "neo4j>=5.28.1",
    "openai-agents>=0.0.17",
    "pandas>=2.3.0",
    "prefect>=3.4.6",
    "python-dotenv>=1.1.0",
]

[project.scripts]
indexing-pipeline = "indexing_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexing_pipeline"]

[tool.ruff]
line-length = 88
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["indexing_pipeline"]

[tool.ruff.lint]
# Enable specific linting rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Ignore specific rules
ignore = [
    "B008",  # Do not perform function call in argument defaults
]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"
