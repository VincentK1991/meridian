[project]
name = "backend"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "basedpyright>=1.29.4",
    "faker>=37.4.0",
    "fastapi>=0.115.12",
    "google-adk>=1.2.1",
    "google-auth>=2.40.3",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "google-genai>=1.19.0",
    "neo4j>=5.28.1",
    "openai-agents>=0.0.17",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "python-jose>=3.5.0",
    "ruff>=0.11.13",
    "uvicorn[standard]>=0.34.3",
    "websockets==13.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Set the maximum line length to 88.
line-length = 88

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable specific linting rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins (builtin shadowing)
    "N",    # pep8-naming (naming conventions)
    "SIM",  # flake8-simplify (code simplification)
    "RET",  # flake8-return (return statements)
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate (commented-out code)
    "RUF",  # Ruff-specific rules
    "ASYNC", # flake8-async (async/await best practices)
]

# Ignore specific rules
ignore = [
    "B008",   # Do not perform function call in argument defaults
    "S101",   # Use of assert detected (common in tests)
    "N805",   # First argument of a method should be named `self`
    "RET504", # Unnecessary assignment before return statement
    "SIM102", # Use a single if-statement instead of nested if-statements (sometimes less readable)
    "ARG002", # Unused method argument (common in overrides)
    "S403", # Use of unsafe pickle.loads
    "S301", # Use of unsafe pickle
    "RUF029", # Function `async`, but doesn't `await` or use `async` features.
    "RUF010", # explicit-f-string-type-conversion
    "S102", # Use of unsafe host value
]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.2.0",
]

[tool.basedpyright]
include = ["app"]
exclude = ["build", "dist"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

# Diagnostic rule customization
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportCallIssue = "warning"
# reportUnknownVariableType = "none"
